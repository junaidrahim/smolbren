name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Validate release packaging script
        run: |
          bash -n scripts/generate-homebrew-formula.sh
          test_dir=$(mktemp -d)
          trap 'rm -rf "$test_dir"' EXIT
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu
          do
            printf '%s\n' "$target" > "$test_dir/smolbren-v1.2.3-$target.tar.gz"
          done
          scripts/generate-homebrew-formula.sh \
            1.2.3 junaidrahim/smolbren "$test_dir" "$test_dir/smolbren.rb"
          ruby -c "$test_dir/smolbren.rb"
          grep -F 'version "1.2.3"' "$test_dir/smolbren.rb"
